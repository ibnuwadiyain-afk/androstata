name: Build Statistical JS Web App as APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24                    # 👈 explicitly use Node 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install                      # 👈 changed from npm ci (no lockfile required)

      - name: Build web app (produces ./dist)
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor and Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init StatsApp com.yourcompany.statsapp --web-dir dist
          npx cap add android
          npx cap sync

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatsApp-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
